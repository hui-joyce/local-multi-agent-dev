[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:langgraph_orchestration.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", "artifacts", ".langgraph_api", "benchmarks/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
"benchmarks/**" = ["E402"]
"langgraph_orchestration/tooling/ida_rpc_server.py" = ["UP"]

[tool.ruff.format]
docstring-code-format = true